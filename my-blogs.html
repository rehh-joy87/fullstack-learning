<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Blogs | BlogSpace</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .myblogs-page {
            min-height: 100vh;
            background: #0b0d10;
        }

        .private-header {
            border-bottom: 1px solid #292f36;
            background: #0b0d10;
        }

        .private-navbar {
            max-width: 1150px;
            min-height: 70px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .private-logo {
            color: #f1f1f1;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
        }

        .private-logo span {
            color: #d6a85f;
        }

        .private-nav {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        .private-nav a {
            padding: 8px 10px;
            color: #8f969f;
            text-decoration: none;
            font-size: 13px;
        }

        .private-nav a:hover,
        .private-nav a.active {
            color: #d6a85f;
        }

        .private-main {
            padding: 55px 20px;
        }

        .private-container {
            max-width: 1150px;
            margin: 0 auto;
        }

        .private-heading {
            padding-bottom: 22px;
            border-bottom: 1px solid #292f36;
            margin-bottom: 25px;
        }

        .private-heading-label {
            color: #d6a85f;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .private-heading h1 {
            margin: 8px 0;
            color: #f1f1f1;
            font-size: 38px;
        }

        .private-heading p {
            margin: 0;
            color: #8f969f;
            font-size: 14px;
        }

        .private-actions {
            margin-bottom: 25px;
        }

        .write-button {
            display: inline-block;
            padding: 11px 16px;
            border: 1px solid #d6a85f;
            color: #d6a85f;
            background: #11151a;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .write-button:hover {
            border-color: #f1f1f1;
            color: #f1f1f1;
        }

        .myblogs-grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .myblog-card {
            min-height: 300px;
            padding: 22px;
            background: #11151a;
            border: 1px solid #292f36;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .myblog-category {
            color: #d6a85f;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .myblog-card h2 {
            margin: 10px 0;
            color: #f1f1f1;
            font-size: 20px;
            line-height: 1.35;
        }

        .myblog-card p {
            color: #8f969f;
            font-size: 14px;
            line-height: 1.7;
            margin: 0 0 15px;
        }

        .myblog-date {
            margin-top: auto;
            margin-bottom: 15px;
            color: #686f78;
            font-size: 12px;
        }

        .myblog-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .small-button {
            padding: 8px 12px;
            border: 1px solid #292f36;
            background: #0d1014;
            color: #d6a85f;
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
        }

        .small-button:hover {
            border-color: #d6a85f;
            color: #f1f1f1;
        }

        .delete-button {
            color: #c2c5c9;
        }

        .status-box {
            grid-column: 1 / -1;
            padding: 35px 20px;
            text-align: center;
            background: #11151a;
            border: 1px solid #292f36;
            color: #8f969f;
            font-size: 14px;
        }

        @media (max-width: 850px) {

            .myblogs-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .private-navbar {
                align-items: flex-start;
                flex-direction: column;
                padding-top: 15px;
                padding-bottom: 15px;
            }

            .myblogs-grid {
                grid-template-columns: 1fr;
            }

            .private-heading h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>

<div class="myblogs-page">

    <!-- =================================================
         NAVIGATION
    ================================================== -->

    <header class="private-header">

        <div class="private-navbar">

            <a
                href="index.html"
                class="private-logo"
            >
                <span>●</span> BlogSpace
            </a>


            <nav class="private-nav">

                <a href="index.html">
                    Home
                </a>

                <a href="blogs.html">
                    Blogs
                </a>

                <a href="categories.html">
                    Categories
                </a>

                <a
                    href="my-blogs.html"
                    class="active"
                >
                    My Blogs
                </a>

                <a href="profile.html">
                    Profile
                </a>

                <a
                    href="#"
                    id="logoutButton"
                >
                    Logout
                </a>

            </nav>

        </div>

    </header>


    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="private-main">

        <div class="private-container">

            <div class="private-heading">

                <span class="private-heading-label">
                    YOUR CONTENT
                </span>

                <h1>
                    My Blogs
                </h1>

                <p>
                    Manage the articles you have published.
                </p>

            </div>


            <div class="private-actions">

                <a
                    href="blog.html"
                    class="write-button"
                >
                    + Write a Blog
                </a>

            </div>


            <section
                id="blogList"
                class="myblogs-grid"
            >

                <div class="status-box">
                    Loading your blogs...
                </div>

            </section>

        </div>

    </main>

</div>


<script>

    const API_URL =
        "http://localhost:3000";


    const token =
        localStorage.getItem("token");


    if (!token) {

        window.location.href =
            "login.html";
    }


    function authHeaders() {

        return {
            "Authorization":
                `Bearer ${token}`
        };
    }


    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value ?? "";

        return div.innerHTML;
    }


    function formatDate(dateValue) {

        if (!dateValue) {
            return "Date unavailable";
        }

        const date =
            new Date(dateValue);

        if (Number.isNaN(date.getTime())) {
            return "Date unavailable";
        }

        return date.toLocaleDateString(
            "en-US",
            {
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        );
    }


    function logout() {

        localStorage.removeItem("token");
        localStorage.removeItem("user");

        window.location.href =
            "index.html";
    }


    document
        .getElementById("logoutButton")
        .addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                logout();
            }
        );


    async function loadMyBlogs() {

        const blogList =
            document.getElementById(
                "blogList"
            );


        try {

            const response =
                await fetch(
                    `${API_URL}/my-blogs`,
                    {
                        headers:
                            authHeaders()
                    }
                );


            if (
                response.status === 401 ||
                response.status === 403
            ) {

                logout();

                return;
            }


            if (!response.ok) {

                throw new Error(
                    "Failed to load blogs"
                );
            }


            const blogs =
                await response.json();


            blogList.innerHTML = "";


            if (!blogs.length) {

                blogList.innerHTML = `
                    <div class="status-box">

                        <strong>
                            You have no blogs yet.
                        </strong>

                        <br><br>

                        Create your first article.

                        <br><br>

                        <a
                            href="blog.html"
                            class="write-button"
                        >
                            Write a Blog
                        </a>

                    </div>
                `;

                return;
            }


            blogs.forEach(function(blog) {

                const card =
                    document.createElement(
                        "article"
                    );

                card.className =
                    "myblog-card";


                const category =
                    blog.category ||
                    "General";


                const title =
                    blog.title ||
                    "Untitled Blog";


                const content =
                    blog.content ||
                    "";


                const shortContent =
                    content.length > 160
                        ? content.substring(0, 160) + "..."
                        : content;


                card.innerHTML = `

                    <span class="myblog-category">
                        ${escapeHtml(category)}
                    </span>

                    <h2>
                        ${escapeHtml(title)}
                    </h2>

                    <p>
                        ${escapeHtml(shortContent)}
                    </p>

                    <div class="myblog-date">
                        ${formatDate(blog.createdAt)}
                    </div>

                    <div class="myblog-actions">

                        <a
                            href="blog-details.html?id=${encodeURIComponent(blog._id)}"
                            class="small-button"
                        >
                            View
                        </a>

                        <a
                            href="edit-blog.html?id=${encodeURIComponent(blog._id)}"
                            class="small-button"
                        >
                            Edit
                        </a>

                        <button
                            type="button"
                            class="small-button delete-button"
                            data-id="${blog._id}"
                        >
                            Delete
                        </button>

                    </div>
                `;


                const deleteButton =
                    card.querySelector(
                        ".delete-button"
                    );


                deleteButton.addEventListener(
                    "click",
                    function() {

                        deleteBlog(
                            blog._id
                        );

                    }
                );


                blogList.appendChild(card);

            });

        } catch (error) {

            console.error(
                "My blogs error:",
                error
            );


            blogList.innerHTML = `
                <div class="status-box">
                    Unable to load your blogs.
                    <br>
                    Please make sure the backend server is running.
                </div>
            `;
        }
    }


    async function deleteBlog(id) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this blog?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    `${API_URL}/blogs/${id}`,
                    {
                        method: "DELETE",
                        headers:
                            authHeaders()
                    }
                );


            if (
                response.status === 401 ||
                response.status === 403
            ) {

                logout();

                return;
            }


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to delete blog"
                );
            }


            alert(
                "Blog deleted successfully!"
            );


            loadMyBlogs();

        } catch (error) {

            console.error(
                "Delete error:",
                error
            );


            alert(
                error.message ||
                "Unable to delete blog."
            );
        }
    }


    loadMyBlogs();

</script>

</body>
</html>
