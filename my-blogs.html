<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Blogs | INKORA</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .myblogs-page {
            min-height: 100vh;
        }

        .private-header {
            border-bottom: 1px solid #dfe6e1;
            background: #fffdf8;
        }

        .private-navbar {
            max-width: 1150px;
            min-height: 70px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .private-logo {
            color: #20242a;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .private-logo span {
            color: #6b9278;
        }

        .private-nav {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        .private-nav a {
            padding: 8px 10px;
            color: #66716b;
            text-decoration: none;
            font-size: 13px;
        }

        .private-nav a:hover,
        .private-nav a.active {
            color: #4f765e;
        }

        .private-main {
            padding: 55px 20px;
        }

        .private-container {
            max-width: 1150px;
            margin: 0 auto;
        }

        .private-heading {
            padding-bottom: 22px;
            border-bottom: 1px solid #dfe6e1;
            margin-bottom: 25px;
        }

        .private-heading-label {
            color: #5f876d;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .private-heading h1 {
            margin: 8px 0;
            color: #20242a;
            font-size: 38px;
        }

        .private-heading p {
            margin: 0;
            color: #718078;
            font-size: 14px;
        }

        .private-actions {
            margin-bottom: 25px;
        }

        .write-button {
            display: inline-block;
            padding: 11px 16px;
            border: 1px solid #6b9278;
            color: #4f765e;
            background: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .write-button:hover {
            background: #f1f7f2;
            border-color: #4f765e;
        }

        .myblogs-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .myblog-card {
            min-height: 390px;
            background: #ffffff;
            border: 1px solid #dfe6e1;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
        }

        .myblog-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
            background: #eef3ef;
            border-bottom: 1px solid #dfe6e1;
        }

        .myblog-no-image {
            width: 100%;
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f2;
            color: #8a968f;
            font-size: 13px;
            border-bottom: 1px solid #dfe6e1;
        }

        .myblog-card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .myblog-category {
            color: #5f876d;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .myblog-card h2 {
            margin: 9px 0;
            color: #20242a;
            font-size: 20px;
            line-height: 1.35;
        }

        .myblog-card p {
            color: #68736d;
            font-size: 14px;
            line-height: 1.7;
            margin: 0 0 15px;
        }

        .myblog-date {
            margin-top: auto;
            margin-bottom: 15px;
            color: #89938e;
            font-size: 12px;
        }

        .myblog-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .small-button {
            padding: 8px 12px;
            border: 1px solid #d3ddd6;
            background: #f8faf8;
            color: #4f765e;
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
        }

        .small-button:hover {
            border-color: #6b9278;
            background: #f1f7f2;
        }

        .delete-button {
            color: #8a5c5c;
        }

        .status-box {
            grid-column: 1 / -1;
            padding: 35px 20px;
            text-align: center;
            background: #ffffff;
            border: 1px solid #dfe6e1;
            color: #718078;
            font-size: 14px;
        }

        @media (max-width: 850px) {

            .myblogs-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .private-navbar {
                align-items: flex-start;
                flex-direction: column;
                padding-top: 15px;
                padding-bottom: 15px;
            }

            .myblogs-grid {
                grid-template-columns: 1fr;
            }

            .private-heading h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>

<div class="myblogs-page">

    <!-- NAVIGATION -->

    <header class="private-header">

        <div class="private-navbar">

            <a
                href="index.html"
                class="private-logo"
            >
                <span>●</span> INKORA
            </a>

            <nav class="private-nav">

                <a href="index.html">
                    Home
                </a>

                <a href="blogs.html">
                    Blogs
                </a>

                <a href="categories.html">
                    Categories
                </a>

                <a
                    href="my-blogs.html"
                    class="active"
                >
                    My Blogs
                </a>

                <a href="profile.html">
                    Profile
                </a>

                <a
                    href="#"
                    id="logoutButton"
                >
                    Logout
                </a>

            </nav>

        </div>

    </header>


    <!-- MAIN -->

    <main class="private-main">

        <div class="private-container">

            <div class="private-heading">

                <span class="private-heading-label">
                    YOUR CONTENT
                </span>

                <h1>
                    My Blogs
                </h1>

                <p>
                    Manage the articles you have published.
                </p>

            </div>


            <div class="private-actions">

                <a
                    href="blog.html"
                    class="write-button"
                >
                    + Write a Blog
                </a>

            </div>


            <section
                id="blogList"
                class="myblogs-grid"
            >

                <div class="status-box">
                    Loading your blogs...
                </div>

            </section>

        </div>

    </main>

</div>


<script src="config.js"></script>

<script>

    const token = sessionStorage.getItem("token");

    if (!token) {
        window.location.href = "login.html";
    }


    function authHeaders() {

        return {
            "Authorization": `Bearer ${token}`
        };

    }


    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value ?? "";

        return div.innerHTML;

    }


    function formatDate(dateValue) {

        if (!dateValue) {
            return "Date unavailable";
        }

        const date =
            new Date(dateValue);

        if (Number.isNaN(date.getTime())) {
            return "Date unavailable";
        }

        return date.toLocaleDateString(
            "en-US",
            {
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        );

    }


    function getImageUrl(imageUrl) {

        if (!imageUrl) {
            return "";
        }

        if (
            imageUrl.startsWith("http://") ||
            imageUrl.startsWith("https://")
        ) {
            return imageUrl;
        }

        return `${API_BASE_URL}${imageUrl}`;

    }


    function logout() {

        sessionStorage.removeItem("token");
        sessionStorage.removeItem("user");

        window.location.href =
            "index.html";

    }


    document
        .getElementById("logoutButton")
        .addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                logout();

            }
        );


    async function loadMyBlogs() {

        const blogList =
            document.getElementById("blogList");


        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/my-blogs`,
                    {
                        headers:
                            authHeaders()
                    }
                );


            if (
                response.status === 401 ||
                response.status === 403
            ) {

                logout();

                return;

            }


            if (!response.ok) {

                throw new Error(
                    "Failed to load blogs."
                );

            }


            const blogs =
                await response.json();


            blogList.innerHTML = "";


            if (!blogs.length) {

                blogList.innerHTML = `

                    <div class="status-box">

                        <strong>
                            You have no blogs yet.
                        </strong>

                        <br><br>

                        Create your first article.

                        <br><br>

                        <a
                            href="blog.html"
                            class="write-button"
                        >
                            Write a Blog
                        </a>

                    </div>

                `;

                return;

            }


            blogs.forEach(function(blog) {

                const card =
                    document.createElement("article");

                card.className =
                    "myblog-card";


                const category =
                    blog.category ||
                    "General";


                const title =
                    blog.title ||
                    "Untitled Blog";


                const content =
                    blog.content ||
                    "";


                const shortContent =
                    content.length > 160
                        ? content.substring(0, 160) + "..."
                        : content;


                const imageUrl =
                    getImageUrl(blog.imageUrl);


                let imageHTML = "";

                if (imageUrl) {

                    imageHTML = `

                        <img
                            src="${escapeHtml(imageUrl)}"
                            alt="${escapeHtml(title)}"
                            class="myblog-image"
                            loading="lazy"
                        >

                    `;

                } else {

                    imageHTML = `

                        <div class="myblog-no-image">
                            No image uploaded
                        </div>

                    `;

                }


                card.innerHTML = `

                    ${imageHTML}

                    <div class="myblog-card-body">

                        <span class="myblog-category">
                            ${escapeHtml(category)}
                        </span>

                        <h2>
                            ${escapeHtml(title)}
                        </h2>

                        <p>
                            ${escapeHtml(shortContent)}
                        </p>

                        <div class="myblog-date">
                            ${formatDate(blog.createdAt)}
                        </div>

                        <div class="myblog-actions">

                            <a
                                href="blog-details.html?id=${encodeURIComponent(blog._id)}"
                                class="small-button"
                            >
                                View
                            </a>

                            <a
                                href="edit-blog.html?id=${encodeURIComponent(blog._id)}"
                                class="small-button"
                            >
                                Edit
                            </a>

                            <button
                                type="button"
                                class="small-button delete-button"
                                data-id="${escapeHtml(blog._id)}"
                            >
                                Delete
                            </button>

                        </div>

                    </div>

                `;


                const deleteButton =
                    card.querySelector(
                        ".delete-button"
                    );


                deleteButton.addEventListener(
                    "click",
                    function() {

                        deleteBlog(
                            blog._id
                        );

                    }
                );


                blogList.appendChild(card);

            });

        } catch (error) {

            console.error(
                "My blogs error:",
                error
            );


            blogList.innerHTML = `

                <div class="status-box">

                    Unable to load your blogs.

                    <br>

                    Please make sure the backend
                    server is running.

                </div>

            `;

        }

    }


    async function deleteBlog(id) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this blog?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/blogs/${encodeURIComponent(id)}`,
                    {
                        method: "DELETE",
                        headers:
                            authHeaders()
                    }
                );


            if (
                response.status === 401 ||
                response.status === 403
            ) {

                logout();

                return;

            }


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to delete blog."
                );

            }


            alert(
                "Blog deleted successfully!"
            );


            loadMyBlogs();

        } catch (error) {

            console.error(
                "Delete error:",
                error
            );


            alert(
                error.message ||
                "Unable to delete blog."
            );

        }

    }


    loadMyBlogs();

</script>

</body>

</html>
