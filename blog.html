<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Write a Blog | INKORA</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- =====================================================
         NAVBAR
    ===================================================== -->

    <header class="site-header">

        <div class="navbar">

            <a
                href="index.html"
                class="logo"
            >
                INKORA
            </a>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="blogs.html">
                    Blogs
                </a>

                <a href="categories.html">
                    Categories
                </a>

                <a href="my-blogs.html">
                    My Blogs
                </a>

                <a href="profile.html">
                    Profile
                </a>

                <a
                    href="#"
                    id="logoutButton"
                    class="nav-button"
                >
                    Logout
                </a>

            </nav>

        </div>

    </header>


    <!-- =====================================================
         CREATE BLOG
    ===================================================== -->

    <main class="page">

        <div class="form-wrapper">

            <div class="form-card">


                <!-- PAGE HEADING -->

                <div class="page-header">

                    <span class="eyebrow">
                        INKORA
                    </span>

                    <h1>
                        Write a Blog
                    </h1>

                    <p>
                        Share your stories, ideas, knowledge
                        and experiences with the INKORA community.
                    </p>

                </div>


                <!-- MESSAGE -->

                <div
                    id="message"
                    class="form-message hidden"
                ></div>


                <!-- BLOG FORM -->

                <form id="blogForm">


                    <!-- =================================================
                         TITLE
                    ================================================= -->

                    <div class="form-group">

                        <label for="title">
                            Blog Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="Enter your blog title"
                            maxlength="200"
                            required
                        >

                    </div>


                    <!-- =================================================
                         CATEGORY
                    ================================================= -->

                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select
                            id="category"
                            name="category"
                            required
                        >

                            <option value="">
                                Select category
                            </option>

                            <option value="Technical">
                                Technical
                            </option>

                            <option value="Food">
                                Food
                            </option>

                            <option value="Travel">
                                Travel
                            </option>

                            <option value="Interior">
                                Interior
                            </option>

                            <option value="Craft">
                                Craft
                            </option>

                            <option value="Music">
                                Music
                            </option>

                            <option value="Nature">
                                Nature
                            </option>

                            <option value="Dresses">
                                Dresses
                            </option>

                            <option value="Climate">
                                Climate
                            </option>

                        </select>

                    </div>


                    <!-- =================================================
                         IMAGE
                    ================================================= -->

                    <div class="form-group">

                        <label for="image">
                            Blog Image
                        </label>

                        <input
                            type="file"
                            id="image"
                            name="image"
                            accept="image/jpeg,image/png,image/webp"
                        >

                        <p class="image-help">
                            Optional. JPG, PNG or WEBP.
                            Maximum size: 5 MB.
                        </p>


                        <!-- IMAGE PREVIEW -->

                        <div
                            id="imagePreview"
                            class="image-preview hidden"
                        >

                            <img
                                id="previewImage"
                                src=""
                                alt="Blog image preview"
                            >

                        </div>

                    </div>


                    <!-- =================================================
                         CONTENT
                    ================================================= -->

                    <div class="form-group">

                        <label for="content">
                            Content
                        </label>

                        <textarea
                            id="content"
                            name="content"
                            placeholder="Write your blog here..."
                            required
                        ></textarea>

                    </div>


                    <!-- =================================================
                         SUBMIT
                    ================================================= -->

                    <button
                        type="submit"
                        class="btn"
                        id="publishButton"
                    >
                        Publish Blog
                    </button>


                </form>

            </div>

        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script src="config.js"></script>

    <script src="script.js"></script>

</body>

</html>
