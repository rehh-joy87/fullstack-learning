<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>All Blogs | INKORA</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .blogs-page {
            min-height: 100vh;
        }

        .blogs-main {
            padding: 55px 20px;
        }

        .blogs-container {
            max-width: 1150px;
            margin: 0 auto;
        }

        .blogs-header {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #dfe6e1;
        }

        .blogs-header-label {
            color: #5f876d;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .blogs-header h1 {
            margin: 8px 0 6px;
            color: #20242a;
            font-size: 38px;
        }

        .blogs-header p {
            margin: 0;
            color: #718078;
            font-size: 14px;
        }

        .write-button {
            display: inline-block;
            padding: 11px 17px;
            border: 1px solid #6b9278;
            color: #4f765e;
            background: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        .write-button:hover {
            color: #365944;
            border-color: #4f765e;
            background: #f1f7f2;
        }

        .blogs-search {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            margin-bottom: 25px;
            background: #ffffff;
            border: 1px solid #d7e0da;
            color: #20242a;
            outline: none;
            font-size: 14px;
        }

        .blogs-search:focus {
            border-color: #6b9278;
        }

        .blogs-search::placeholder {
            color: #8a958f;
        }

        .category-filter {
            display: none;
            margin-bottom: 25px;
            padding: 13px 15px;
            border: 1px solid #d7e0da;
            background: #f5f8f5;
            color: #55715f;
            font-size: 13px;
        }

        .category-filter.active {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .clear-category {
            color: #5f876d;
            text-decoration: none;
            font-weight: 600;
            white-space: nowrap;
        }

        .clear-category:hover {
            color: #365944;
        }

        .blogs-grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .public-blog-card {
            display: flex;
            flex-direction: column;
            min-height: 390px;
            background: #ffffff;
            border: 1px solid #dfe6e1;
            box-sizing: border-box;
            overflow: hidden;
        }

        .public-blog-card:hover {
            border-color: #b8c9bd;
        }

        .public-blog-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
            background: #eef3ef;
            border-bottom: 1px solid #dfe6e1;
        }

        .public-blog-no-image {
            width: 100%;
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f2;
            color: #89958e;
            font-size: 13px;
            border-bottom: 1px solid #dfe6e1;
        }

        .public-blog-body {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 20px;
        }

        .public-category {
            color: #5f876d;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .public-blog-card h2 {
            margin: 10px 0;
            color: #20242a;
            font-size: 20px;
            line-height: 1.35;
        }

        .public-blog-card p {
            color: #68736d;
            font-size: 14px;
            line-height: 1.7;
            margin: 0 0 15px;
        }

        .public-meta {
            color: #89938e;
            font-size: 12px;
            margin-top: auto;
            margin-bottom: 15px;
        }

        .read-button {
            display: inline-block;
            padding: 9px 13px;
            border: 1px solid #d3ddd6;
            color: #4f765e;
            background: #f8faf8;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            align-self: flex-start;
        }

        .read-button:hover {
            border-color: #6b9278;
            color: #365944;
            background: #f1f7f2;
        }

        .blogs-status {
            grid-column: 1 / -1;
            padding: 35px 20px;
            text-align: center;
            border: 1px solid #dfe6e1;
            color: #718078;
            background: #ffffff;
            font-size: 14px;
        }

        /* HEADER */

        .public-header {
            border-bottom: 1px solid #dfe6e1;
            background: #fffdf8;
        }

        .public-navbar {
            max-width: 1150px;
            min-height: 70px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .public-logo {
            color: #20242a;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .public-logo span {
            color: #6b9278;
        }

        .public-nav {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        .public-nav a {
            padding: 8px 10px;
            color: #66716b;
            text-decoration: none;
            font-size: 13px;
        }

        .public-nav a:hover,
        .public-nav a.active {
            color: #4f765e;
        }

        .public-nav .nav-cta {
            border: 1px solid #d3ddd6;
            color: #4f765e;
        }

        .public-nav .nav-cta:hover {
            border-color: #6b9278;
            background: #f1f7f2;
        }

        .site-footer-simple {
            border-top: 1px solid #dfe6e1;
            padding: 22px 20px;
            color: #7c8781;
            font-size: 12px;
        }

        .footer-simple-inner {
            max-width: 1150px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        @media (max-width: 850px) {

            .blogs-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .blogs-header {
                align-items: flex-start;
                flex-direction: column;
            }

        }

        @media (max-width: 600px) {

            .public-navbar {
                align-items: flex-start;
                flex-direction: column;
                padding-top: 15px;
                padding-bottom: 15px;
            }

            .blogs-grid {
                grid-template-columns: 1fr;
            }

            .blogs-header h1 {
                font-size: 30px;
            }

            .footer-simple-inner {
                flex-direction: column;
            }

            .category-filter.active {
                align-items: flex-start;
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

<div class="blogs-page">

    <!-- =========================
         NAVIGATION
    ========================= -->

    <header class="public-header">

        <div class="public-navbar">

            <a
                href="index.html"
                class="public-logo"
            >
                <span>●</span> INKORA
            </a>


            <nav class="public-nav">

                <a href="index.html">
                    Home
                </a>

                <a
                    href="blogs.html"
                    class="active"
                >
                    Blogs
                </a>

                <a href="categories.html">
                    Categories
                </a>


                <!-- LOGGED-IN LINKS -->

                <span
                    id="loggedInLinks"
                    style="display: none; align-items: center; gap: 7px;"
                >

                    <a href="my-blogs.html">
                        My Blogs
                    </a>

                    <a href="profile.html">
                        Profile
                    </a>

                    <a
                        href="#"
                        id="logoutButton"
                    >
                        Logout
                    </a>

                </span>


                <!-- LOGGED-OUT LINKS -->

                <span
                    id="loggedOutLinks"
                    style="display: inline-flex; align-items: center; gap: 7px;"
                >

                    <a href="register.html">
                        Register
                    </a>

                    <a href="login.html">
                        Login
                    </a>

                </span>


                <!-- WRITE BLOG -->

                <a
                    href="login.html"
                    id="writeBlogButton"
                    class="nav-cta"
                >
                    Write a Blog
                </a>

            </nav>

        </div>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="blogs-main">

        <div class="blogs-container">

            <div class="blogs-header">

                <div>

                    <span class="blogs-header-label">
                        DISCOVER
                    </span>

                    <h1 id="blogsTitle">
                        All Blogs
                    </h1>

                    <p id="blogsDescription">
                        Browse every public article on INKORA.
                    </p>

                </div>


                <a
                    href="login.html"
                    id="topWriteButton"
                    class="write-button"
                >
                    Write a Blog
                </a>

            </div>


            <!-- CATEGORY FILTER -->

            <div
                id="categoryFilter"
                class="category-filter"
            >

                <span id="categoryFilterText"></span>

                <a
                    href="blogs.html"
                    class="clear-category"
                >
                    View All Blogs
                </a>

            </div>


            <!-- SEARCH -->

            <input
                type="text"
                id="searchInput"
                class="blogs-search"
                placeholder="Search by title, category or content..."
            >


            <!-- BLOG LIST -->

            <section
                id="blogList"
                class="blogs-grid"
            >

                <div class="blogs-status">
                    Loading blogs...
                </div>

            </section>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer class="site-footer-simple">

        <div class="footer-simple-inner">

            <span>
                © 2026 INKORA
            </span>

            <span>
                Stories. Ideas. Knowledge.
            </span>

        </div>

    </footer>

</div>


<script src="config.js"></script>


<script>

    let allBlogs = [];


    const blogList =
        document.getElementById("blogList");


    const searchInput =
        document.getElementById("searchInput");


    /*
        Read category from URL.

        Example:

        blogs.html?category=Food
    */

    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const selectedCategory =
        urlParams.get("category");


    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value ?? "";

        return div.innerHTML;

    }


    function formatDate(dateValue) {

        if (!dateValue) {
            return "Date unavailable";
        }

        const date =
            new Date(dateValue);

        if (Number.isNaN(date.getTime())) {
            return "Date unavailable";
        }

        return date.toLocaleDateString(
            "en-US",
            {
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        );

    }


    function getImageUrl(imageUrl) {

        if (!imageUrl) {
            return "";
        }

        if (
            imageUrl.startsWith("http://") ||
            imageUrl.startsWith("https://")
        ) {
            return imageUrl;
        }

        return `${API_BASE_URL}${imageUrl}`;

    }


    function updateNavigation() {

        const token =
            sessionStorage.getItem("token");


        const loggedInLinks =
            document.getElementById(
                "loggedInLinks"
            );


        const loggedOutLinks =
            document.getElementById(
                "loggedOutLinks"
            );


        const writeBlogButton =
            document.getElementById(
                "writeBlogButton"
            );


        const topWriteButton =
            document.getElementById(
                "topWriteButton"
            );


        if (token) {

            loggedInLinks.style.display =
                "inline-flex";

            loggedInLinks.style.alignItems =
                "center";

            loggedInLinks.style.gap =
                "7px";

            loggedOutLinks.style.display =
                "none";


            writeBlogButton.href =
                "blog.html";

            topWriteButton.href =
                "blog.html";

        } else {

            loggedInLinks.style.display =
                "none";

            loggedOutLinks.style.display =
                "inline-flex";

            loggedOutLinks.style.alignItems =
                "center";

            loggedOutLinks.style.gap =
                "7px";


            writeBlogButton.href =
                "login.html";

            topWriteButton.href =
                "login.html";

        }

    }


    /*
        CATEGORY INFORMATION
    */

    function setupCategoryHeading() {

        const title =
            document.getElementById(
                "blogsTitle"
            );


        const description =
            document.getElementById(
                "blogsDescription"
            );


        const categoryFilter =
            document.getElementById(
                "categoryFilter"
            );


        const categoryFilterText =
            document.getElementById(
                "categoryFilterText"
            );


        if (selectedCategory) {

            const displayCategory =
                selectedCategory.trim();


            title.textContent =
                displayCategory + " Blogs";


            description.textContent =
                "Browse public articles in the " +
                displayCategory +
                " category.";


            categoryFilterText.textContent =
                "Showing category: " +
                displayCategory;


            categoryFilter.classList.add(
                "active"
            );

        }

    }


    /*
        LOGOUT
    */

    document
        .getElementById("logoutButton")
        .addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                sessionStorage.removeItem("token");
                sessionStorage.removeItem("user");

                window.location.href =
                    "index.html";

            }
        );


    /*
        RENDER BLOGS
    */

    function renderBlogs() {

        const search =
            searchInput.value
                .trim()
                .toLowerCase();


        const filtered =
            allBlogs.filter(function(blog) {

                /*
                    CATEGORY FILTER
                */

                if (selectedCategory) {

                    const blogCategory =
                        (blog.category || "")
                        .trim()
                        .toLowerCase();


                    const wantedCategory =
                        selectedCategory
                        .trim()
                        .toLowerCase();


                    if (
                        blogCategory !==
                        wantedCategory
                    ) {

                        return false;

                    }

                }


                /*
                    SEARCH FILTER
                */

                const title =
                    (blog.title || "")
                    .toLowerCase();


                const content =
                    (blog.content || "")
                    .toLowerCase();


                const category =
                    (blog.category || "")
                    .toLowerCase();


                return (
                    title.includes(search) ||
                    content.includes(search) ||
                    category.includes(search)
                );

            });


        blogList.innerHTML = "";


        if (!filtered.length) {

            let message =
                "No matching blogs found.";


            if (selectedCategory) {

                message =
                    `No blogs found in the "${escapeHtml(
                        selectedCategory
                    )}" category.`;

            }


            blogList.innerHTML = `

                <div class="blogs-status">

                    ${message}

                    <br><br>

                    <a
                        href="categories.html"
                        class="read-button"
                    >
                        Browse Categories
                    </a>

                </div>

            `;

            return;

        }


        filtered.forEach(function(blog) {

            const card =
                document.createElement("article");


            card.className =
                "public-blog-card";


            const category =
                blog.category ||
                "General";


            const title =
                blog.title ||
                "Untitled Blog";


            const content =
                blog.content ||
                "";


            const shortContent =
                content.length > 180
                    ? content.substring(0, 180) + "..."
                    : content;


            const imageUrl =
                getImageUrl(
                    blog.imageUrl
                );


            let imageHTML = "";


            if (imageUrl) {

                imageHTML = `

                    <img
                        src="${escapeHtml(imageUrl)}"
                        alt="${escapeHtml(title)}"
                        class="public-blog-image"
                        loading="lazy"
                    >

                `;

            } else {

                imageHTML = `

                    <div class="public-blog-no-image">
                        No image uploaded
                    </div>

                `;

            }


            card.innerHTML = `

                ${imageHTML}

                <div class="public-blog-body">

                    <span class="public-category">
                        ${escapeHtml(category)}
                    </span>

                    <h2>
                        ${escapeHtml(title)}
                    </h2>

                    <p>
                        ${escapeHtml(shortContent)}
                    </p>

                    <div class="public-meta">
                        ${formatDate(blog.createdAt)}
                    </div>

                    <a
                        class="read-button"
                        href="blog-details.html?id=${encodeURIComponent(
                            blog._id
                        )}"
                    >
                        Read Story →
                    </a>

                </div>

            `;


            blogList.appendChild(card);

        });

    }


    /*
        LOAD PUBLIC BLOGS
    */

    async function loadBlogs() {

        try {

            /*
                PUBLIC ENDPOINT.
                No Authorization header needed.
            */

            const response =
                await fetch(
                    `${API_BASE_URL}/blogs`
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load blogs."
                );

            }


            allBlogs =
                await response.json();


            renderBlogs();

        } catch (error) {

            console.error(
                "All blogs error:",
                error
            );


            blogList.innerHTML = `

                <div class="blogs-status">

                    Unable to load blogs.

                    <br>

                    Please make sure the backend
                    server is running.

                </div>

            `;

        }

    }


    /*
        SEARCH
    */

    searchInput.addEventListener(
        "input",
        renderBlogs
    );


    /*
        INITIALIZE
    */

    updateNavigation();

    setupCategoryHeading();

    loadBlogs();

</script>

</body>

</html>
