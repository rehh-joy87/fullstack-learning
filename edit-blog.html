<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Blog | INKORA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="site-header">

        <div class="navbar">

            <a href="index.html" class="logo">
                <span class="logo-dot">●</span> INKORA
            </a>

            <nav class="nav-links">

                <a href="index.html">Home</a>

                <a href="blogs.html">Blogs</a>

                <a href="categories.html">Categories</a>

                <a href="my-blogs.html">My Blogs</a>

                <a href="profile.html">Profile</a>

                <a href="#" id="logoutButton">Logout</a>

            </nav>

        </div>

    </header>


    <!-- EDIT BLOG -->

    <main class="page">

        <div class="form-wrapper">

            <div class="form-card">

                <h1>Edit Blog</h1>

                <p class="form-intro">
                    Update your story, category, image, or content.
                </p>


                <div
                    id="message"
                    class="form-message"
                ></div>


                <form id="editForm">

                    <!-- TITLE -->

                    <div class="form-group">

                        <label for="title">
                            Blog Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            placeholder="Enter your blog title"
                            required
                        >

                    </div>


                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select id="category" required>

                            <option value="Technical">
                                Technical
                            </option>

                            <option value="Food">
                                Food
                            </option>

                            <option value="Travel">
                                Travel
                            </option>

                            <option value="Interior">
                                Interior
                            </option>

                            <option value="Craft">
                                Craft
                            </option>

                            <option value="Music">
                                Music
                            </option>

                            <option value="Nature">
                                Nature
                            </option>

                            <option value="Dresses">
                                Dresses
                            </option>

                            <option value="Climate">
                                Climate
                            </option>

                        </select>

                    </div>


                    <!-- CURRENT IMAGE -->

                    <div
                        class="form-group"
                        id="currentImageGroup"
                        style="display:none;"
                    >

                        <label>
                            Current Image
                        </label>

                        <div class="image-preview">

                            <img
                                id="currentImage"
                                src=""
                                alt="Current blog image"
                            >

                        </div>

                    </div>


                    <!-- NEW IMAGE -->

                    <div class="form-group">

                        <label for="image">
                            Replace Image
                        </label>

                        <input
                            type="file"
                            id="image"
                            accept="image/jpeg,image/png,image/webp"
                        >

                        <div class="image-help">
                            Optional. JPG, PNG or WEBP. Maximum size: 5 MB.
                        </div>

                    </div>


                    <!-- NEW IMAGE PREVIEW -->

                    <div
                        id="imagePreview"
                        class="image-preview hidden"
                    >

                        <img
                            id="previewImage"
                            src=""
                            alt="New image preview"
                        >

                    </div>


                    <!-- CONTENT -->

                    <div class="form-group">

                        <label for="content">
                            Content
                        </label>

                        <textarea
                            id="content"
                            placeholder="Write your blog content..."
                            required
                        ></textarea>

                    </div>


                    <!-- BUTTON -->

                    <button
                        type="submit"
                        id="saveButton"
                        class="form-button"
                    >
                        Save Changes
                    </button>

                </form>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="site-footer">

        <p>
            © 2026 INKORA | Stories. Ideas. Knowledge.
        </p>

    </footer>


    <script src="config.js"></script>
    <script src="editBlog.js"></script>

</body>

</html>
