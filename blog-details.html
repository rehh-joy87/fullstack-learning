<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Blog Details | INKORA</title>

<link rel="stylesheet" href="style.css">

<style>

    /* =========================================
       BLOG DETAILS PAGE
    ========================================= */

    .blog-details-page {
        max-width: 900px;
        margin: 0 auto;
        padding: 55px 20px 80px;
    }


    /* =========================================
       ARTICLE
    ========================================= */

    .article-card {
        background: #ffffff;
        border: 1px solid #e1e7e3;
        border-radius: 12px;
        overflow: hidden;
    }


    /* =========================================
       ARTICLE HEADER
    ========================================= */

    .article-header {
        padding: 40px 45px 30px;
    }


    .article-category {
        display: inline-block;

        margin-bottom: 16px;
        padding: 6px 12px;

        background: #edf4ef;
        border: 1px solid #d4e2d8;
        border-radius: 20px;

        color: #55715f;

        font-size: 12px;
        font-weight: 600;

        text-transform: uppercase;
        letter-spacing: 0.6px;
    }


    .article-title {
        margin: 0 0 15px;

        color: #20242a;

        font-size: 42px;
        line-height: 1.2;
        font-weight: 700;
    }


    .article-meta {
        color: #7a847e;
        font-size: 14px;
    }


    /* =========================================
       COVER IMAGE
    ========================================= */

    .article-cover {
        width: 100%;
        max-height: 500px;

        display: block;

        object-fit: cover;

        border-top: 1px solid #e1e7e3;
        border-bottom: 1px solid #e1e7e3;

        background: #eef3ef;
    }


    .article-no-image {
        min-height: 220px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #f3f7f4;

        border-top: 1px solid #e1e7e3;
        border-bottom: 1px solid #e1e7e3;

        color: #89958e;
        font-size: 14px;
    }


    /* =========================================
       ARTICLE BODY
    ========================================= */

    .article-body {
        padding: 35px 45px 40px;
    }


    .article-content {
        color: #343a40;

        font-size: 17px;
        line-height: 1.9;

        white-space: pre-wrap;
        word-break: break-word;
    }


    /* =========================================
       ARTICLE ACTIONS
    ========================================= */

    .article-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;

        margin-top: 35px;
        padding-top: 25px;

        border-top: 1px solid #e1e6e3;
    }


    .article-actions a,
    .article-actions button {
        padding: 9px 16px;

        border: 1px solid #cfdad3;
        border-radius: 7px;

        background: #f7faf8;

        color: #50685a;

        text-decoration: none;
        font-size: 13px;
        font-weight: 500;

        cursor: pointer;
    }


    .article-actions a:hover,
    .article-actions button:hover {
        background: #edf4ef;
        border-color: #b9cbbf;
    }


    /* =========================================
       LOADING / ERROR MESSAGE
    ========================================= */

    .blog-message {
        padding: 50px 25px;

        text-align: center;

        background: #ffffff;
        border: 1px solid #e1e7e3;
        border-radius: 12px;

        color: #68736d;
        font-size: 15px;
    }


    /* =========================================
       HEADER
    ========================================= */

    .site-header {
        width: 100%;

        background: rgba(255, 255, 255, 0.97);

        border-bottom: 1px solid #dfe5e1;
    }


    .navbar {
        max-width: 1200px;
        min-height: 70px;

        margin: 0 auto;
        padding: 0 25px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 30px;
    }


    .logo {
        display: inline-flex;
        align-items: center;
        gap: 8px;

        flex-shrink: 0;

        color: #20242a;

        font-size: 24px;
        font-weight: 700;

        letter-spacing: 1px;

        text-decoration: none;
    }


    .logo::before {
        content: "●";

        color: #6b9278;
        font-size: 12px;
    }


    .nav-links {
        display: flex;
        align-items: center;
        justify-content: flex-end;

        gap: 26px;

        flex: 1;
    }


    .nav-links > a,
    .nav-auth-links > a {
        color: #3e4642;

        text-decoration: none;

        font-size: 14px;
        font-weight: 500;

        white-space: nowrap;
    }


    .nav-links > a:hover,
    .nav-auth-links > a:hover {
        color: #5f8069;
    }


    .nav-auth-links {
        display: flex;
        align-items: center;
        gap: 26px;
    }


    /* =========================================
       FOOTER
    ========================================= */

    .site-footer {
        margin-top: 30px;

        background: #ffffff;

        border-top: 1px solid #dfe5e1;
    }


    .footer-inner {
        max-width: 1200px;

        margin: 0 auto;
        padding: 25px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        color: #737d77;

        font-size: 13px;
    }


    /* =========================================
       TABLET
    ========================================= */

    @media (max-width: 800px) {

        .navbar {
            flex-direction: column;

            justify-content: center;

            padding: 18px 20px;
        }


        .nav-links {
            width: 100%;

            justify-content: center;

            flex-wrap: wrap;

            gap: 14px 20px;
        }


        .nav-auth-links {
            gap: 14px 20px;
        }


        .article-header {
            padding: 30px 25px 25px;
        }


        .article-body {
            padding: 30px 25px 35px;
        }


        .article-title {
            font-size: 32px;
        }


        .article-content {
            font-size: 16px;
            line-height: 1.8;
        }


        .footer-inner {
            flex-direction: column;
            gap: 8px;

            text-align: center;
        }

    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 550px) {

        .blog-details-page {
            padding: 35px 15px 60px;
        }


        .article-card {
            border-radius: 10px;
        }


        .article-header {
            padding: 25px 20px 22px;
        }


        .article-title {
            font-size: 28px;
        }


        .article-meta {
            font-size: 13px;
        }


        .article-body {
            padding: 25px 20px 30px;
        }


        .article-content {
            font-size: 15.5px;
            line-height: 1.75;
        }


        .article-cover {
            max-height: 350px;
        }


        .article-actions {
            margin-top: 30px;
        }

    }

</style>


</head>

<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="site-header">

    <nav class="navbar">

        <a href="index.html"
           class="logo">

            INKORA

        </a>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="blogs.html">
                Blogs
            </a>

            <a href="categories.html">
                Categories
            </a>


            <span id="authLinks"
                  class="nav-auth-links">
            </span>

        </div>

    </nav>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main class="blog-details-page">


    <div id="blogContainer">

        <div class="blog-message">

            Loading blog...

        </div>

    </div>


</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer class="site-footer">

    <div class="footer-inner">

        <span>
            © 2026 INKORA
        </span>

        <span>
            Stories. Ideas. Knowledge.
        </span>

    </div>

</footer>



<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="config.js"></script>

<script src="blogDetails.js"></script>


</body>

</html>
