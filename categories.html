<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Categories - BlogSpace</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="site-header">

    <nav class="navbar">

        <a href="index.html" class="logo">
            BlogSpace
        </a>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="blogs.html">
                Blogs
            </a>

            <a href="categories.html" class="active">
                Categories
            </a>

            <span id="authLinks"></span>

        </div>

    </nav>

</header>


<main class="page">

    <div class="page-header">

        <span class="eyebrow">
            EXPLORE
        </span>

        <h1>
            Categories
        </h1>

        <p>
            Browse blogs by topic.
        </p>

    </div>


    <div
        id="categoryList"
        class="category-grid">

        <div class="status-message">
            Loading categories...
        </div>

    </div>

</main>


<footer class="site-footer">

    <div class="footer-inner">

        <span>
            © 2026 BlogSpace
        </span>

        <span>
            Explore
        </span>

    </div>

</footer>


<script>

const API_URL = "http://localhost:3000";


// ---------------------------------------------------------
// NAV
// ---------------------------------------------------------

function setupNavigation() {

    const authLinks =
        document.getElementById("authLinks");

    if (localStorage.getItem("token")) {

        authLinks.innerHTML = `

            <a href="my-blogs.html">
                My Blogs
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="profile.html">
                Profile
            </a>

            <a href="blog.html" class="nav-button">
                Write a Blog
            </a>

            <a href="#" onclick="logout()">
                Logout
            </a>

        `;

    } else {

        authLinks.innerHTML = `

            <a href="register.html">
                Register
            </a>

            <a href="login.html">
                Login
            </a>

        `;
    }
}


// ---------------------------------------------------------
// LOAD CATEGORIES
// ---------------------------------------------------------

async function loadCategories() {

    try {

        const response =
            await fetch(`${API_URL}/blogs`);

        if (!response.ok) {
            throw new Error("Failed to load blogs");
        }

        const blogs =
            await response.json();

        const categories = {};

        blogs.forEach(blog => {

            const category =
                blog.category || "General";

            categories[category] =
                (categories[category] || 0) + 1;

        });

        const categoryList =
            document.getElementById("categoryList");

        const entries =
            Object.entries(categories);

        if (!entries.length) {

            categoryList.innerHTML =
                `<div class="empty-state">
                    No categories available.
                 </div>`;

            return;
        }

        categoryList.innerHTML =
            entries.map(([name, count]) => `

                <a
                    class="category-card"
                    href="blogs.html?category=${encodeURIComponent(name)}">

                    <h3>
                        ${escapeHTML(name)}
                    </h3>

                    <p>
                        ${count}
                        ${count === 1 ? "blog" : "blogs"}
                    </p>

                </a>

            `).join("");

    } catch (error) {

        console.error(error);

        document.getElementById("categoryList").innerHTML =
            `<div class="status-message">
                Unable to load categories.
             </div>`;
    }
}


// ---------------------------------------------------------
// LOGOUT
// ---------------------------------------------------------

function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("user");

    window.location.href = "index.html";
}


// ---------------------------------------------------------
// ESCAPE
// ---------------------------------------------------------

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


setupNavigation();
loadCategories();

</script>

</body>
</html>
